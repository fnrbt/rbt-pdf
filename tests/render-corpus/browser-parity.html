<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Published PDF viewer parity</title>
  <style>
    body { margin: 0; font: 14px sans-serif; background: #ddd; }
    header { padding: 8px; background: white; }
    #captures { display: flex; flex-wrap: wrap; gap: 12px; padding: 8px; align-items: flex-start; }
    figure { margin: 0; } figcaption { padding: 4px; } figure img { display: block; background: white; max-width: 100%; }
    #viewer { width: 100%; }
  </style>
</head>
<body>
<header>Published @rbt/pdf and pdfjs-dist browser parity <span id="status">Loading modules…</span></header>
<div id="captures"><figure><figcaption>Fable viewer</figcaption><img id="fable-image" alt="Fable rendering"></figure><figure><figcaption>pdf.js</figcaption><img id="pdfjs-image" alt="pdf.js rendering"></figure></div>
<div id="viewer"></div>
<script type="module">
// Observe, but do not replace, the viewer's actual worker protocol. The opened
// sizes are needed because openPdf deliberately exposes only the page count.
const NativeWorker = window.Worker;
const workerStats = { created: 0, terminated: 0, active: 0, opened: 0, rendersRequested: 0, rendered: 0, errors: 0 };
let currentWorker = null;
let activeSignal = null;
window.Worker = class extends NativeWorker {
  constructor(url, options) {
    super(url, options);
    if (!String(url).includes('/WorkerRuntime.js')) return;
    this.parity = { sizes: null, requests: new Map(), rendered: [], terminated: false };
    currentWorker = this;
    workerStats.created++; workerStats.active++;
    if (activeSignal) {
      if (activeSignal.aborted) queueMicrotask(() => this.terminate());
      else activeSignal.addEventListener('abort', () => this.terminate(), { once: true });
    }
    this.addEventListener('message', event => {
      const msg = event.data;
      if (msg.kind === 'opened') { this.parity.sizes = msg.sizes; workerStats.opened++; }
      if (msg.kind === 'rendered') {
        const request = this.parity.requests.get(msg.id);
        this.parity.rendered.push({ page: msg.page, scale: request?.scale, id: msg.id, width: msg.width, height: msg.height });
        workerStats.rendered++;
      }
      if (msg.kind === 'error') workerStats.errors++;
      this.parity.requests.delete(msg.id);
    });
    this.addEventListener('error', () => { workerStats.errors++; });
  }
  postMessage(message, transfer) {
    if (this.parity && message?.kind === 'render') {
      this.parity.requests.set(message.id, { scale: message.scale, page: message.page });
      workerStats.rendersRequested++;
    }
    return super.postMessage(message, transfer);
  }
  terminate() {
    if (this.parity && !this.parity.terminated) {
      this.parity.terminated = true; workerStats.terminated++; workerStats.active--;
    }
    return super.terminate();
  }
};

const root = new URL('./results/browser-parity/vendor/', location.href);
const rbtRoot = new URL(new URLSearchParams(location.search).get('rbt') || 'rbt/package/', root);
const pdfjsRoot = new URL('pdfjs/package/', root);
const viewerElement = document.querySelector('#viewer');
const status = document.querySelector('#status');
const TIMEOUT_MS = 60000;
const dpr = () => window.devicePixelRatio || 1;
const errorString = error => String(error?.stack || error?.message || error);
const now = () => performance.now();
const frame = () => new Promise(resolve => requestAnimationFrame(resolve));

function whiteCapture(canvas) {
  const output = document.createElement('canvas');
  output.width = canvas.width; output.height = canvas.height;
  const context = output.getContext('2d');
  context.fillStyle = 'white'; context.fillRect(0, 0, output.width, output.height);
  context.drawImage(canvas, 0, 0);
  return output.toDataURL('image/png');
}
function show(engine, png) { document.querySelector(`#${engine}-image`).src = png; }
function failure(error, start) {
  return { ok: false, width: 0, height: 0, png: null, text: '', seconds: (now() - start) / 1000, error: errorString(error) };
}
function withTimeout(work, label) {
  const controller = new AbortController();
  let timer;
  const timeout = new Promise((_, reject) => {
    timer = setTimeout(() => { controller.abort(); reject(new Error(`${label} timed out after ${TIMEOUT_MS} ms`)); }, TIMEOUT_MS);
  });
  return Promise.race([work(controller.signal), timeout]).finally(() => clearTimeout(timer));
}
function checkAbort(signal) { if (signal.aborted) throw new Error('Render timed out'); }

let openPdf, pdfjs;
async function fableRender(bytes, pageNumber, maxSide) {
  const start = now();
  let scale = null;
  try {
    const result = await withTimeout(async signal => {
      let viewer, worker;
      const cleanup = () => {
        if (viewer) { viewer.dispose(); viewer = null; }
        else {
          worker ||= currentWorker;
          if (worker) worker.terminate();
        }
      };
      signal.addEventListener('abort', cleanup, { once: true });
      try {
        currentWorker = null;
        activeSignal = signal;
        const opening = openPdf(viewerElement, bytes, new URL('assets/', rbtRoot).href);
        opening.then(value => { if (signal.aborted) value.dispose(); }, () => {});
        viewer = await opening;
        worker = currentWorker;
        checkAbort(signal);
        const sizes = worker?.parity?.sizes;
        if (!sizes || !sizes[pageNumber - 1]) throw new Error(`Fable page ${pageNumber} unavailable`);
        const [width, height] = sizes[pageNumber - 1];
        if (!(width > 0 && height > 0)) throw new Error('Invalid Fable page dimensions');
        // The shared scale is physical pixels per PDF point, including DPR.
        scale = maxSide / Math.max(width, height);
        const zoom = scale / dpr();
        viewer.setZoom(zoom);
        viewer.scrollToPage(pageNumber);
        const target = viewerElement.querySelector(`[data-page="${pageNumber}"]`);
        if (!target) throw new Error(`Fable page element ${pageNumber} missing`);
        // scrollToPage uses smooth scrolling; force immediate visibility as well.
        target.scrollIntoView({ behavior: 'instant', block: 'start' });
        for (;;) {
          checkAbort(signal);
          const matchingResponse = worker.parity.rendered.findLast(r => r.page === pageNumber && Math.abs(r.scale - scale) < 1e-9);
          const canvas = target.querySelector('canvas');
          const textLayer = target.querySelector('.text-layer');
          // A response alone is not installation: wait for the actual canvas and
          // text layer after PageView's response handler has run.
          if (matchingResponse && canvas && textLayer && canvas.width === matchingResponse.width && canvas.height === matchingResponse.height && canvas.width > 0 && canvas.height > 0) {
            const png = whiteCapture(canvas);
            const text = textLayer.textContent || '';
            show('fable', png);
            return { ok: true, width: canvas.width, height: canvas.height, png, text, seconds: (now() - start) / 1000 };
          }
          await frame();
        }
      } finally {
        if (activeSignal === signal) activeSignal = null;
        signal.removeEventListener('abort', cleanup);
        cleanup();
      }
    }, 'Fable');
    return { result, scale };
  } catch (error) { return { result: failure(error, start), scale }; }
}

async function pdfjsRender(bytes, pageNumber, maxSide, sharedScale) {
  const start = now();
  try {
    return await withTimeout(async signal => {
      let loadingTask, documentProxy, renderTask;
      const cleanup = () => {
        if (renderTask) { try { renderTask.cancel(); } catch (_) {} renderTask = null; }
        if (loadingTask) { loadingTask.destroy().catch(() => {}); loadingTask = null; }
      };
      signal.addEventListener('abort', cleanup, { once: true });
      try {
        loadingTask = pdfjs.getDocument({
          data: bytes.slice(),
          cMapUrl: new URL('cmaps/', pdfjsRoot).href, cMapPacked: true,
          standardFontDataUrl: new URL('standard_fonts/', pdfjsRoot).href,
          wasmUrl: new URL('wasm/', pdfjsRoot).href,
        });
        documentProxy = await loadingTask.promise;
        checkAbort(signal);
        const page = await documentProxy.getPage(pageNumber);
        checkAbort(signal);
        const unscaled = page.getViewport({ scale: 1 });
        const scale = sharedScale ?? maxSide / Math.max(unscaled.width, unscaled.height);
        const viewport = page.getViewport({ scale });
        const canvas = document.createElement('canvas');
        canvas.width = Math.ceil(viewport.width); canvas.height = Math.ceil(viewport.height);
        const context = canvas.getContext('2d');
        context.fillStyle = 'white'; context.fillRect(0, 0, canvas.width, canvas.height);
        renderTask = page.render({ canvasContext: context, canvas, viewport, intent: 'display', background: 'white', annotationMode: pdfjs.AnnotationMode.ENABLE });
        await renderTask.promise;
        renderTask = null;
        checkAbort(signal);
        const content = await page.getTextContent();
        checkAbort(signal);
        const text = content.items.map(item => item.str || '').join('');
        const png = canvas.toDataURL('image/png');
        show('pdfjs', png);
        return { ok: true, width: canvas.width, height: canvas.height, png, text, seconds: (now() - start) / 1000 };
      } finally {
        signal.removeEventListener('abort', cleanup);
        cleanup();
      }
    }, 'pdf.js');
  } catch (error) { return failure(error, start); }
}

// Serialize calls because the viewer owns one DOM container and one observed worker.
let queue = Promise.resolve();
async function render(url, pageNumber, maxSide = 800) {
  const run = async () => {
    document.querySelector('#fable-image').removeAttribute('src');
    document.querySelector('#pdfjs-image').removeAttribute('src');
    status.textContent = `Rendering ${url}, page ${pageNumber}`;
    let bytes;
    try {
      bytes = await withTimeout(async signal => {
        const response = await fetch(url, { signal });
        if (!response.ok) throw new Error(`fetch ${url}: ${response.status}`);
        return new Uint8Array(await response.arrayBuffer());
      }, 'Fetch');
    } catch (error) {
      const failed = failure(error, now());
      status.textContent = 'Fetch failed';
      return { fable: failed, pdfjs: { ...failed } };
    }
    const fable = await fableRender(bytes, pageNumber, maxSide);
    const pdfjs = await pdfjsRender(bytes, pageNumber, maxSide, fable.scale);
    status.textContent = `Finished ${url}, page ${pageNumber}`;
    window.scrollTo({ top: 0, behavior: 'instant' });
    return { fable: fable.result, pdfjs };
  };
  const result = queue.then(run, run);
  queue = result.catch(() => {});
  return result;
}
window.parity = { ready: false, render, workerStats, error: null };
try {
  [{ openPdf }, pdfjs] = await Promise.all([
    import(new URL('dist/App.js', rbtRoot).href),
    import(new URL('build/pdf.mjs', pdfjsRoot).href),
  ]);
  pdfjs.GlobalWorkerOptions.workerSrc = new URL('build/pdf.worker.mjs', pdfjsRoot).href;
  window.parity.ready = true;
  status.textContent = 'Ready';
} catch (error) {
  window.parity.error = errorString(error);
  status.textContent = `Module load failed: ${window.parity.error}`;
}
</script>
</body>
</html>
